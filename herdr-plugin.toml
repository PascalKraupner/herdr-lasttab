id = "lasttab"
name = "lasttab"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Last-used tab and workspace toggles, the equivalents of tmux last-window and switch-client -l"
platforms = ["linux", "macos"]

# herdr 0.9.0 made tab/workspace focus client-local: client-driven switches no
# longer run tab.focused/workspace.focused event hooks (those fire only when an
# API call changes the canonical focus). A watcher process polls the canonical
# focus instead; the startup hook spawns it and every toggle respawns it if it
# died. Both MRU pairs live in separate state files so they cannot clobber
# each other.
[[startup]]
command = ["bin/lasttab.js", "ensure-watcher"]

[[actions]]
id = "toggle"
title = "Last tab"
contexts = ["workspace"]
command = ["bin/lasttab.js", "toggle"]

[[actions]]
id = "toggle-workspace"
title = "Last workspace"
contexts = ["workspace"]
command = ["bin/lasttab.js", "toggle-workspace"]
